<h2>Your assignment</h2>
<p>Maintain the Summit Supply website and secure this Ubuntu server. This is a local practice prototype, not official CyberPatriot CCS.</p>
<h2>Business requirements</h2>
<ul><li>Apache must serve the catalog over HTTPS. HTTP must redirect to HTTPS.</li><li>Keep all three catalog products, prices, and the service marker intact.</li><li>SSH access for the authorized administrator must remain available.</li><li>Do not disable or tamper with the scoring service or its files.</li></ul>
<h2>Authorized accounts</h2>
<p><strong>jwang</strong> is the authorized administrator. Preserve operating-system and application service accounts; they are not employees. No contractor account is authorized. Never post passwords in reports.</p>
<h2>Scoring</h2>
<p>Five configuration checks are worth 10 points each. This initial prototype may already earn points for secure defaults. Weaknesses will be introduced separately after isolation and recovery are verified. External service-availability scoring will be added on score01.</p>
