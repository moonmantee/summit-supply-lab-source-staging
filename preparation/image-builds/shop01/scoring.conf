name = "summit-shop01-prototype"
title = "Summit Supply — Ubuntu Practice"
os = "Ubuntu 24.04 LTS"
user = "jwang"
version = "2.1.1"
local = true
shell = false

[[check]]
message = "Unauthorized contractor account removed"
points = 10
  [[check.pass]]
  type = "UserExistsNot"
  user = "contractor_lab"

[[check]]
message = "The nobody service account has no sudo-group membership"
points = 10
  [[check.pass]]
  type = "UserExists"
  user = "nobody"
  [[check.pass]]
  type = "FileContainsNot"
  path = "/etc/group"
  value = '(?m)^sudo:[^:\r\n]*:[0-9]+:([^,\r\n]+,)*nobody(,|$)'

[[check]]
message = "Password database has approved ownership and permissions"
points = 10
  [[check.pass]]
  type = "FileOwner"
  path = "/etc/shadow"
  name = "root"
  [[check.pass]]
  type = "PermissionIs"
  path = "/etc/shadow"
  value = "rw-r-----"

[[check]]
message = "Direct SSH login as root is disabled"
points = 10
  [[check.pass]]
  type = "ServiceUp"
  name = "ssh"
  [[check.pass]]
  type = "CommandOutput"
  cmd = "/usr/sbin/sshd -T -C user=root,host=shop01,addr=10.77.10.50 | /usr/bin/awk '$1 == \"permitrootlogin\" {print $2}'"
  value = "no"

[[check]]
message = "SSH refuses empty passwords"
points = 10
  [[check.pass]]
  type = "ServiceUp"
  name = "ssh"
  [[check.pass]]
  type = "CommandOutput"
  cmd = "/usr/sbin/sshd -T -C user=jwang,host=shop01,addr=10.77.10.50 | /usr/bin/awk '$1 == \"permitemptypasswords\" {print $2}'"
  value = "no"
