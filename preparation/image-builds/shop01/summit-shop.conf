<VirtualHost *:80>
    ServerName shop01.corp.summit.test
    ServerAlias shop01 10.77.30.10
    Redirect permanent / https://10.77.30.10/
</VirtualHost>
<VirtualHost *:443>
    ServerName shop01.corp.summit.test
    ServerAlias shop01 10.77.30.10
    DocumentRoot /var/www/summit
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/summit-shop01.crt
    SSLCertificateKeyFile /etc/ssl/private/summit-shop01.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    <Directory /var/www/summit>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/summit-error.log
    CustomLog ${APACHE_LOG_DIR}/summit-access.log combined
</VirtualHost>
