<h1>Summit Supply — AlmaLinux Workstation</h1>
<p><strong>Draft participant instructions.</strong> This scenario is still being built. The installed baseline scoring report is not yet the final competition report.</p>
<p>You maintain a domain-joined AlmaLinux 9.8 employee workstation. Investigate unauthorized access, unsafe configuration, prohibited software, and suspicious persistence. Keep normal employee desktop use and existing lab business resources working.</p>
<h2>Authorized access</h2>
<ul>
<li><strong>jwang</strong>: organizer recovery administrator, separate from competitor access. Preserve the account, its authenticated sudo access, and organizer SSH key access.</li>
<li><strong>competitor-recovery</strong>: approved local competitor fallback when the domain controller is unavailable. Log in without a domain suffix. Preserve its local password authentication and password-required sudo with a five-minute cache; do not remove this account or join it to the domain.</li>
<li><strong>alex.admin@corp.summit.test</strong> and <strong>taylor.admin@corp.summit.test</strong>: domain competitor administrators, members of the dedicated Linux-Workstation-Admins security group. Their workstation sudo must require their domain password. Preserve their domain login and approved administration access.</li>
<li><strong>summit-admin</strong>: retained, disabled synthetic training identity. Preserve its disabled state; approved competition administration uses the CORP accounts or local fallback.</li>
<li><strong>summit-keyuser</strong>: approved local training identity used for SSH-key permission checks. Retain its public key and protect its SSH directory and authorized_keys file. This account starts noninteractive; do not enable it merely to repair permissions.</li>
<li><strong>summit-employee</strong> and <strong>summit-auditor</strong>: approved ordinary local employees. Neither may have administrative or sudo privileges.</li>
<li><strong>summit-unknown</strong>: not an approved employee account.</li>
<li><strong>summit-departed</strong>: departed employee. Retain the account and business data, while preventing interactive access.</li>
<li>Preserve the CORP domain join and domain-managed authorization. Do not remove domain users or change domain policy as a shortcut to local policy remediation.</li>
</ul>
<h2>Required functions and policy</h2>
<p>Keep SSH, SSSD/domain authentication, DNS, required business access, GNOME, Firefox, gedit, audit collection, firewalld, SELinux, and the scoring service functional. Restrict inbound access to required workstation traffic, including authorized organizer SSH. Do not disable required services to conceal an insecure setting.</p>
<p>Local passwords must have an effective minimum of 14 characters, enforced password-quality checks, and at least five remembered passwords. Configure local failed-login lockout for five attempts within 900 seconds, with a 900-second unlock time; domain users must remain under domain lockout policy. Sudo must require authentication for approved training administration, with credential caching no longer than five minutes. Direct root SSH and empty-password SSH are prohibited. Restrict SSH to the approved groups jwang, competitor-recovery, and linux-workstation-admins@corp.summit.test, preserving organizer, local fallback, and both domain competitor administrators. Ordinary employees are desktop users and do not require SSH access.</p>
<p>Firefox phishing, malware, and download protections must be enabled and locked by machine-wide policy, covering local and CORP desktop users. Preserve the real corporate and standard certificate authorities. Remove only the fictional training CA when identified. Firefox and gedit must remain eligible for updates. Use approved AlmaLinux repositories, retain package-signature verification, and configure automatic security updates.</p>
<p>Automatic GNOME screen locking must occur within 300 seconds and be enforced for employee sessions. Keep persistent journals and account-change audit records. Required account-file audit watches use the summit-identity key. Protect the required Summit configuration and shell initialization files from ordinary-user modification. Shared temporary storage must retain approved ownership, permissions, and SELinux labeling.</p>
<h2>Unauthorized content and services</h2>
<p>Printing and local service discovery are unnecessary on this endpoint: CUPS and Avahi, including socket/path activation, are unauthorized. Cockpit web administration, Nmap, and the bundled offline game are prohibited on this employee workstation. Authorized scanning on other lab hosts is outside this workstation exercise.</p>
<p>Fictional credential notes and personal-media samples in Desktop, Documents, or Downloads are prohibited, including renamed copies. The shared team Downloads folder is /srv/summit-competition/Downloads, available through Summit Shared Files on the desktop. All approved competitor home folders and the retained organizer content folders are included in this policy. Remove suspicious cron/systemd persistence and its live scripts. The summit-marker-runner system account is a noninteractive execution identity for the training markers; preserve required system accounts and investigate the scheduled tasks rather than enabling system-account login.</p>
<h2>Forensic questions</h2>
<p>Preserved synthetic evidence is in /opt/summit-evidence. It is training evidence, not a claim about a real intrusion. Keep that evidence intact even when removing live persistence.</p>
<p>Open the separate Forensic Question 1, Forensic Question 2, and Forensic Question 3 desktop icons. Each opens its own question file in /srv/summit-competition with an Answer = section. Enter your answer in that question's section and save the file; there is no separate answer sheet. The question files are shared by both domain administrators and the local fallback account. Synthetic incident evidence is retained in /opt/summit-evidence.</p>
<p>Do not modify scoring probes, engine files, reports, or organizer backups to earn credit. Notify the organizer if a check appears inconsistent with the required state.</p>
