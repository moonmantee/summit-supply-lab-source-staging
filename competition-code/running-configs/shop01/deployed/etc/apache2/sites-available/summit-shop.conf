<VirtualHost *:80>
    ServerName shop01.corp.summit.test
    ServerAlias shop01 10.77.30.10
    Redirect permanent / https://10.77.30.10/
</VirtualHost>
<VirtualHost *:443>
    ServerName shop01.corp.summit.test
    ServerAlias shop01 10.77.30.10
    DocumentRoot /var/www/summit
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/summit-shop01.crt
    SSLCertificateKeyFile /etc/ssl/private/summit-shop01.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    <Directory /var/www/summit>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /dev/null
    CustomLog /dev/null combined

    <Directory /var/www/summit/training-fixtures/listing>
        Options +Indexes
        Require all granted
    </Directory>
    <Directory /var/www/summit/training-fixtures>
        <FilesMatch "^(public-backup[.]sql|[.]private-note)$">
            Require all granted
        </FilesMatch>
    </Directory>
    <Location /server-status>
        SetHandler server-status
        Require all granted
    </Location>
    <Directory /var/www/summit/training-fixtures/cgi>
        Options +ExecCGI
        AddHandler cgi-script .cgi
        Require all granted
    </Directory>
    <Directory /var/www/summit/training-fixtures/ssi>
        Options +Includes
        AddType text/html .shtml
        AddOutputFilter INCLUDES .shtml
        Require all granted
    </Directory>
</VirtualHost>
