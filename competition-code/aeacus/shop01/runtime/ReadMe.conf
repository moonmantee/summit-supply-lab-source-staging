<h2>Your assignment</h2>
<p>Secure the Summit Supply Ubuntu server while maintaining its PHP storefront and database-backed business workflows. This lab uses Aeacus for forty remediation objectives worth 100 points. External service availability is scored separately.</p>
<h2>Required business services</h2>
<ul>
<li>Apache and PHP must serve the catalog over trusted HTTPS. HTTP must redirect to HTTPS.</li>
<li>Retain all three products, their current database prices, order data, ordering and order-history functionality.</li>
<li>Preserve the configured database connection to sql01. Do not disclose application credentials.</li>
<li>Preserve hostname, lab networking, internal DNS, approved certificates, time synchronization, AD membership and authorized domain access.</li>
<li>Keep SSH available for authorized administrators. Preserve the local recovery administrator and its installed key.</li>
<li>Do not disable, modify or remove the scoring engine, probe files, private scenario metadata or report viewer.</li>
</ul>
<h2>Authorized local accounts</h2>
<p><strong>jwang</strong> is the organizer/recovery administrator; preserve its password, sudo privileges and key. <strong>summit_editor</strong> is an approved maintenance administrator with authenticated sudo and SSH access. <strong>summit_employee</strong> and <strong>summit_support</strong> are approved ordinary employees and must remain; they have no sudo or SSH role. Existing operating-system/application service accounts are required. A dedicated locked marker-runner system account is not an employee or administrator. Contractor accounts and additional root-equivalent identities are not authorized.</p>
<h2>Local account policy</h2>
<p>Local employee passwords must have a minimum length of fourteen characters, enforced quality checks, history of at least five passwords, and a maximum age of ninety days. Positive character credits must not shorten the required length. Local failed-login policy is five failures within fifteen minutes, with a fifteen-minute unlock time. Keep local enforcement separate from AD account policy and preserve recovery access.</p>
<h2>Service policy</h2>
<p>Web traffic on ports 80 and 443 is required. Restrict administrator SSH to the approved organizer and scorer sources: 10.77.10.50, 10.77.10.1, 10.77.30.1 (the firewall's shop-network address used by ProxyJump) and 10.77.70.10. Keep domain and database client traffic functional. Do not expose extra inbound services.</p>
<p>AppArmor must enforce the installed rsyslogd profile. Retain auditd and account/privilege configuration auditing, persistent journald storage, Apache access/error logging, and scheduled Ubuntu security updates through approved update sources. Do not hold Apache back from updates.</p>
<h2>Application policy</h2>
<p>The PHP store requires no CGI or server-side includes in its catalog training area. Directory listings, public diagnostics, backup data and dotfiles must not expose internal information. Only authorized administrators may modify business content or security configuration. Protect password data and TLS private keys.</p>
<p>The former cron, systemd and SUID training markers have been retired. Retain legitimate operating-system jobs and executables.</p>
<h2>Forensic questions</h2>
<p>Open the separate Forensic Question 1, 2 and 3 desktop icons. Each opens its own file under /srv/summit-shop01-forensics, with one Answer = line. Enter your answer after the equals sign and save the file. These three questions replace the former persistence checks and are worth two points each; the scenario still has forty checks worth 100 points.</p>
<p>Read the preserved fictional incident evidence under /opt/summit-evidence/shop01. It is separate from live logs and contains no real customer data or credentials. Question files are shared between the approved local accounts and the existing authorized domain participant. Do not erase the evidence.</p>
<h2>Scoring</h2>
<p>Credit reflects current remediation state and can be lost if a correction regresses. Removing required employees/files or shutting down required services is not a repair. Never publish passwords, keys or private recovery archives in your report.</p>
