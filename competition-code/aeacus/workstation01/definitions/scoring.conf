name = "summit-workstation01-alma-baseline"
title = "Summit Supply - AlmaLinux Workstation Baseline"
os = "AlmaLinux 9.8"
user = "jwang"
version = "2.1.1"
local = true
shell = false

[[check]]
message = "SSH service is running"
points = 10
[[check.pass]]
type = "ServiceUp"
name = "sshd"

[[check]]
message = "firewalld service is running (baseline availability check)"
points = 10
[[check.pass]]
type = "ServiceUp"
name = "firewalld"

[[check]]
message = "SELinux is enforcing"
points = 10
[[check.pass]]
type = "CommandOutput"
cmd = "/usr/sbin/getenforce"
value = "Enforcing"
