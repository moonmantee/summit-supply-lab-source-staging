<h1>Summit Supply: SQL01 competition</h1>
<p>Secure this Linux Mint 22.3 database server while maintaining the shop and forum. Thirty remediation objectives total 100 points. External business-service availability is a separate scoring contract.</p>
<h2>Preserve business operations</h2>
<p>Keep MariaDB on 10.77.50.20:3306, SSH administration on port 22, existing lab networking, DNS, time synchronization, SSSD and corp.summit.test membership. Preserve every table and business row in summit_shop and forum. Keep shop_app from 10.77.30.10 and forum_app from 10.77.30.20 with their existing application privileges on their own databases. The forum must not read shop data. The shop needs no global FILE privilege. LOCAL INFILE must be disabled in both running and persistent MariaDB configuration. The undocumented training_vendor database account is not authorized and must be removed. Do not change application credentials or require database TLS until White Team authorizes compatible client configuration.</p>
<h2>Authorized users</h2>
<p>jwang is the local recovery administrator and supported local competitor account. Preserve its password, SSH key and authenticated sudo access. alex.admin@corp.summit.test and taylor.admin@corp.summit.test are supported domain users; preserve their existing login access. Domain administration does not automatically authorize Linux sudo. This exercise does not change any AD account or GPO. Preserve required operating-system accounts and Mint maintenance helper privileges.</p>
<p>summit_employee and summit_contractor are retained synthetic ordinary identities. Keep them locked and noninteractive, and remove their administrative grants, including group-derived or alternate grants. summit_marker is a locked system identity used by harmless training artifacts; it is not an administrator. No new interactive identity is needed.</p>
<h2>Required protections</h2>
<p>Disable direct root SSH login, empty-password SSH authentication, X11 forwarding, agent forwarding, TCP forwarding, and user-controlled SSH environment files. Limit SSH authentication attempts to at most three, and enable VERBOSE authentication logging. Preserve authorized SSH login.</p>
<p>Keep /srv/summit-sql01/operations/catalog-backup.txt intact and owned by root, with no access for unapproved users and no group or public write access. Retain the inert /etc/profile.d/summit-sql01-training.sh file, owned by root and unwritable by ordinary users. Keep persistent journald storage. Enable effective and boot-persistent hard-link and symbolic-link protections, kernel pointer restrictions, and restricted kernel-message access (fs.protected_hardlinks, fs.protected_symlinks, kernel.kptr_restrict, kernel.dmesg_restrict must be at least 1).</p>
<h2>Prohibited services and content</h2>
<p>This database server has no printing or discovery role. Disable Avahi and CUPS, including sockets, paths and automatic activation. Remove the unauthorized cron marker, systemd marker timer/service activation and live marker payloads under /usr/local/lib/summit-sql01. They are inert, unprivileged training artifacts. Preserve ordinary cron jobs and system timers.</p>
<p>Remove the designated fictional plaintext credential material and personal-media material from /srv/summit-sql01/shared and the supported users' home directories, including renamed copies. Preserve business documents. These materials contain no real credentials or personal media.</p>
<h2>Forensic questions</h2>
<p>Each of the three desktop question icons opens its own file in /srv/summit-sql01/questions. Write only in the blank Answer section and save. Question instructions specify the answer format. Independent evidence copies under /srv/summit-sql01/evidence must remain available after live artifact cleanup. Do not fill a shared answer sheet.</p>
<h2>Scoring and recovery</h2>
<p>The local scoring report is /opt/aeacus/assets/ScoringReport.html; use the SQL01-Score desktop icon. Repairs can lose credit if protections regress. Do not modify the encrypted scoring configuration, probe files, private metadata, or scorer service. Shutting down business services is not a repair. Ask White Team for recovery assistance. Manual session, business-client, reboot, snapshot-restore and export acceptance are tracked in /srv/summit-sql01/Acceptance.html.</p>
